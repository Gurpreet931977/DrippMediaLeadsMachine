version: '3.7'

services:
  searxng:
    container_name: dripp_searxng
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BIND_ADDRESS=0.0.0.0:8080
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=dripp-searxng
    restart: unless-stopped
