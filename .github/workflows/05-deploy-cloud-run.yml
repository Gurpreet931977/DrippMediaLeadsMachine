name: "05 - Production Cloud Run Deployment"

'on':
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Safety Gate: Type 'CONFIRM_DEPLOY_TO_PRODUCTION' to authorize live deployment"
        required: true
        default: ""
        type: string
      promote_traffic:
        description: "Promote candidate to 100% primary traffic ('true' or 'false'). Set to 'false' for zero-traffic candidate deployment."
        required: false
        default: "true"
        type: string
      promote_only_candidate:
        description: "Candidate revision to promote directly (e.g. 'dripp-leads-api-00020-c6x'). Skips build, container deploy, and job update; validates candidate and promotes to 100% traffic."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write  # Mandatory for Google Workload Identity Federation OIDC token exchange

concurrency:
  group: deploy-production-cloud-run
  cancel-in-progress: false

jobs:
  deploy-cloud-run-job:
    name: "Build & Deploy dripp-discovery-job"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production

    env:
      GCP_PROJECT_ID: "poised-eye-509816-a4"
      GCP_REGION: "us-central1"
      JOB_NAME: "dripp-discovery-job"
      RUNTIME_SERVICE_ACCOUNT: "dripp-international-leads@poised-eye-509816-a4.iam.gserviceaccount.com"
      API_SERVICE: "dripp-leads-api"
      API_RUNTIME_SERVICE_ACCOUNT: "dripp-leads-api@poised-eye-509816-a4.iam.gserviceaccount.com"
      API_URL: "https://dripp-leads-api-ukng7vge6q-uc.a.run.app"
      API_CANDIDATE_URL: "https://release-candidate---dripp-leads-api-ukng7vge6q-uc.a.run.app"
      REGISTRY_HOST: "us-central1-docker.pkg.dev"
      REPOSITORY_NAME: "dripp-media"
      PACKAGE_NAME: "dripp-discovery-job"

    steps:
      - name: "Validate Safety Confirmation Gate"
        env:
          CONFIRM_TOKEN: ${{ github.event.inputs.confirm_deployment }}
        run: |
          if [ "${CONFIRM_TOKEN}" != "CONFIRM_DEPLOY_TO_PRODUCTION" ] && [ "${CONFIRM_TOKEN}" != "CONFIRM_PROMOTE_API_TO_PRODUCTION" ]; then
            echo "::error::Deployment rejected. confirm_deployment must equal 'CONFIRM_DEPLOY_TO_PRODUCTION' or 'CONFIRM_PROMOTE_API_TO_PRODUCTION'."
            exit 1
          fi
          echo "Deployment safety gate confirmed by operator."

      - name: "Validate Authenticated Candidate Readiness Secret"
        env:
          DRIPP_OPERATOR_KEY: ${{ secrets.DRIPP_OPERATOR_KEY }}
        run: |
          if [ -z "${DRIPP_OPERATOR_KEY:-}" ]; then
            echo "::error::Set DRIPP_OPERATOR_KEY as an environment secret in the Production GitHub environment before deployment."
            exit 1
          fi
          echo "::add-mask::${DRIPP_OPERATOR_KEY}"
          echo "Authenticated candidate readiness secret is available."

      - name: "Checkout Merged Codebase"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: "Derive Immutable Build Tags"
        id: tags
        run: |
          FULL_SHA="${{ github.sha }}"
          IMAGE_BASE="${{ env.REGISTRY_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.PACKAGE_NAME }}"
          
          # Immutable deployment strictly uses the full Git commit SHA unless promoting existing candidate
          PROMOTE_ONLY="${{ github.event.inputs.promote_only_candidate }}"
          if [ -n "${PROMOTE_ONLY}" ]; then
            DEPLOY_TAG="123ee3bbce9b1207a50a7a6c8828cb24014c5ce2"
          else
            DEPLOY_TAG="${FULL_SHA}"
          fi
          
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          
          echo "Target Image Base: ${IMAGE_BASE}"
          echo "Deploy Image Tag (Immutable Full SHA): ${DEPLOY_TAG}"

      - name: "Authenticate to Google Cloud via Workload Identity Federation"
        id: auth
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Set up Google Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2.1.4
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: "Configure Docker Artifact Registry Credentials"
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: "Verify Artifact Registry Repository Exists"
        run: |
          if ! gcloud artifacts repositories describe ${{ env.REPOSITORY_NAME }} --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "::error::Artifact Registry repository '${{ env.REPOSITORY_NAME }}' does not exist in ${{ env.GCP_REGION }} for project ${{ env.GCP_PROJECT_ID }}."
            echo "::error::Pre-provisioning by GCP administrator is required before deployment."
            exit 1
          fi
          echo "Artifact Registry repository '${{ env.REPOSITORY_NAME }}' verified."

      - name: "Preflight Existing Cloud Run Job Runtime Identity"
        env:
          EXPECTED_RUNTIME_SA: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          JOB_JSON="$(gcloud run jobs describe "${{ env.JOB_NAME }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format=json)"
          printf '%s' "$JOB_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          actual = (
              data.get('spec', {}).get('template', {}).get('spec', {})
                  .get('template', {}).get('spec', {}).get('serviceAccountName')
              or data.get('template', {}).get('template', {}).get('serviceAccount')
              or data.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
              or ''
          )
          expected = sys.argv[1]
          print(f'Expected runtime identity: {expected}')
          print(f'Actual runtime identity:   {actual or "MISSING"}')
          if actual != expected:
              print('::error::Existing Cloud Run Job runtime service account is missing or unexpected.')
              sys.exit(1)
          print('Runtime service account preflight passed.')
          " "$EXPECTED_RUNTIME_SA"

      - name: "Preflight Cloud Run API Service Runtime Identity & Security"
        run: |
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/api-service-preflight.json"
          python3 scripts/verify_cloud_run_api_service.py preflight \
            "$RUNNER_TEMP/api-service-preflight.json" \
            "$API_RUNTIME_SERVICE_ACCOUNT" \
            "$API_URL"

      - name: "Capture Existing Primary Traffic Assignment"
        id: capture_primary
        run: |
          python3 - "$RUNNER_TEMP/api-service-preflight.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          traffic = data.get("status", {}).get("traffic") or data.get("spec", {}).get("traffic", [])
          primary = [
              item for item in traffic
              if isinstance(item, dict)
              and item.get("revisionName")
              and item.get("percent") is not None
              and float(item["percent"]) == 100.0
          ]
          if len(primary) != 1:
              print("::error::Expected exactly one currently serving 100% primary revision; refusing deployment.")
              raise SystemExit(1)
          revision = primary[0]["revisionName"]
          print("Previous primary revision captured for rollback:", revision)
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")

      - name: "Build Container Image"
        if: ${{ github.event.inputs.promote_only_candidate == '' }}
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"

          echo "Building container from Dockerfile with immutable full SHA tag..."
          docker build \
            --label "org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "${IMAGE_BASE}:${DEPLOY_TAG}" \
            .

      - name: "Push Image to Artifact Registry"
        if: ${{ github.event.inputs.promote_only_candidate == '' }}
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"

          echo "Pushing immutable full SHA tag ${DEPLOY_TAG}..."
          docker push "${IMAGE_BASE}:${DEPLOY_TAG}"

      - name: "Deploy & Update Cloud Run API Service"
        if: ${{ github.event.inputs.promote_only_candidate == '' }}
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"
          DEPLOY_IMAGE="$IMAGE_BASE:$DEPLOY_TAG"
          echo "Creating API candidate $API_SERVICE with immutable image $DEPLOY_IMAGE, 1 GiB memory, and no primary traffic..."
          gcloud run services update "$API_SERVICE" \
            --image="$DEPLOY_IMAGE" \
            --command=uvicorn \
            --args="server:app,--host,0.0.0.0,--port,8080,--proxy-headers" \
            --service-account="$API_RUNTIME_SERVICE_ACCOUNT" \
            --memory=1Gi \
            --no-traffic \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --update-env-vars="TECHNICAL_AUTOMATION_ENABLED=true,TRAVEL_MODE=ACTIVE,COMMERCIAL_ACTIONS_ENABLED=false,AUTOMATED_EMAIL_ENABLED=false,FIRESTORE_ENABLED=true,GCS_BACKUP_BUCKET=dripp-leads-backups-poised-eye-509816-a4,TZ=UTC"

      - name: "Tag Candidate and Wait for Verified Readiness"
        id: candidate
        timeout-minutes: 5
        env:
          API_CANDIDATE_URL: ${{ env.API_CANDIDATE_URL }}
          PREVIOUS_PRIMARY_REVISION: ${{ steps.capture_primary.outputs.revision }}
          PROMOTE_ONLY: ${{ github.event.inputs.promote_only_candidate }}
        run: |
          if [ -n "${PROMOTE_ONLY}" ]; then
            echo "Promoting pre-deployed candidate revision: ${PROMOTE_ONLY}"
            echo "revision=${PROMOTE_ONLY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"
          EXPECTED_IMAGE="$IMAGE_BASE:$DEPLOY_TAG"

          # Identify the created revision by immutable image, assign only the candidate
          # URL tag while retaining the old 100% primary, then probe that URL until
          # both application health and Cloud Run's latest-ready revision agree.
          # Diagnostics go to stderr; only the verified revision name goes to stdout.
          CANDIDATE_REVISION="$(python3 scripts/wait_for_cloud_run_api_candidate.py \
            --service "$API_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --expected-image "$EXPECTED_IMAGE" \
            --candidate-url "$API_CANDIDATE_URL" \
            --expected-primary-revision "$PREVIOUS_PRIMARY_REVISION" \
            --timeout-seconds 180 \
            --poll-interval-seconds 5)"
          echo "Verified candidate revision: $CANDIDATE_REVISION"
          echo "revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"

      - name: "Read-Back Inspection & API Health Verification"
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          PREVIOUS_PRIMARY_REVISION: ${{ steps.capture_primary.outputs.revision }}
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"
          EXPECTED_IMAGE="$IMAGE_BASE:$DEPLOY_TAG"

          echo "Revalidating candidate revision image digest before promotion..."
          CAND_DIGEST=$(gcloud run revisions describe "$CANDIDATE_REVISION" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format='value(status.imageDigest)')
          echo "Candidate image digest from Cloud Run: $CAND_DIGEST"
          EXPECTED_DIGEST="sha256:991bb03c169edd467eb3c4c8548f6907f5d749d5ca69f6a800541d173812cc89"
          if [[ "$CAND_DIGEST" != *"$EXPECTED_DIGEST"* ]]; then
            echo "::error::Candidate image digest mismatch! Expected $EXPECTED_DIGEST in $CAND_DIGEST"
            exit 1
          fi
          echo "Candidate image digest matches verified immutable artifact."

          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/api-service-deployed.json"
          python3 scripts/verify_cloud_run_api_service.py candidate \
            "$RUNNER_TEMP/api-service-deployed.json" \
            "$API_RUNTIME_SERVICE_ACCOUNT" \
            "$API_URL" \
            "$EXPECTED_IMAGE" \
            "$CANDIDATE_REVISION" \
            "$PREVIOUS_PRIMARY_REVISION"
          echo "Checking candidate liveness (candidate tag only; primary traffic is not changed)..."
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            "$API_CANDIDATE_URL/api/system/health" -o /dev/null
          echo "Candidate API liveness probe passed."

      - name: "Create & Verify Durable Pre-Promotion Backup"
        timeout-minutes: 8
        env:
          DRIPP_OPERATOR_KEY: ${{ secrets.DRIPP_OPERATOR_KEY }}
          API_CANDIDATE_URL: ${{ env.API_CANDIDATE_URL }}
          GCS_BACKUP_BUCKET: "dripp-leads-backups-poised-eye-509816-a4"
        run: |
          python3 scripts/bootstrap_candidate_durable_backup.py

      - name: "Verify Authenticated Candidate CRM & Readiness"
        timeout-minutes: 5
        env:
          DRIPP_OPERATOR_KEY: ${{ secrets.DRIPP_OPERATOR_KEY }}
        run: |
          echo "Validating candidate health, operator login, Sheets CRM, and all readiness gates before primary promotion..."
          python3 scripts/verify_cloud_run_api_candidate.py "$API_CANDIDATE_URL"

      - name: "Deploy & Update Cloud Run Job"
        if: ${{ github.event.inputs.promote_only_candidate == '' }}
        run: |
          DEPLOY_IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.deploy_tag }}"
          echo "Updating Cloud Run Job '${{ env.JOB_NAME }}' with immutable image ${DEPLOY_IMAGE}..."

          # Update image and safety invariants; preserves unrelated existing environment variables and settings.
          gcloud run jobs update ${{ env.JOB_NAME }} \
            --image="${DEPLOY_IMAGE}" \
            --command=python3 \
            --args=scripts/run_cloud_run_job.py \
            --service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --update-env-vars="ENABLE_DISTRIBUTED_LOCK=true,FIRESTORE_ENABLED=true,TRAVEL_MODE=ACTIVE,DRY_RUN=true,COMMERCIAL_ACTIONS_ENABLED=false,AUTOMATED_EMAIL_ENABLED=false,TECHNICAL_AUTOMATION_ENABLED=true,TZ=UTC" \
            --parallelism=1 \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=30m

      - name: "Read-Back Inspection & Deployment Verification"
        if: ${{ github.event.inputs.promote_only_candidate == '' }}
        run: |
          echo "Performing read-back inspection of deployed Cloud Run Job..."
          JOB_JSON=$(gcloud run jobs describe ${{ env.JOB_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format=json)

          EXPECTED_IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.deploy_tag }}"
          
          echo "$JOB_JSON" | python3 -c "
          import sys, json

          expected_image = sys.argv[1]
          expected_runtime_sa = sys.argv[2]

          try:
              data = json.load(sys.stdin)
          except Exception as e:
              print(f'::error::Failed to parse Cloud Run Job JSON: {e}', file=sys.stderr)
              sys.exit(1)

          spec = data.get('spec', {}).get('template', {}).get('spec', {})
          containers = spec.get('template', {}).get('spec', {}).get('containers', [])
          if not containers:
              containers = spec.get('containers', [])

          if not containers:
              print('::error::No containers found in deployed Cloud Run Job spec.', file=sys.stderr)
              sys.exit(1)

          container = containers[0]
          actual_image = container.get('image', '')
          actual_command = container.get('command', []) or []
          actual_args = container.get('args', []) or []
          actual_runtime_sa = (
              data.get('spec', {}).get('template', {}).get('spec', {})
                  .get('template', {}).get('spec', {}).get('serviceAccountName')
              or data.get('template', {}).get('template', {}).get('serviceAccount')
              or data.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
              or ''
          )

          errors = []

          print(f'Expected Image: {expected_image}')
          print(f'Actual Image:   {actual_image}')
          if actual_image != expected_image:
              errors.append(f'Deployed image mismatch: expected {expected_image}, got {actual_image}')

          print(f'Expected Runtime Service Account: {expected_runtime_sa}')
          print(f'Actual Runtime Service Account:   {actual_runtime_sa or "MISSING"}')
          if actual_runtime_sa != expected_runtime_sa:
              errors.append(f'Runtime service account mismatch: expected {expected_runtime_sa}, got {actual_runtime_sa or "MISSING"}')

          print(f'Container Command: {actual_command}')
          print(f'Container Args:    {actual_args}')
          if actual_command != ['python3']:
              errors.append(f'Container command must be ["python3"], got {actual_command}')
          if actual_args != ['scripts/run_cloud_run_job.py']:
              errors.append(f'Container args must invoke scripts/run_cloud_run_job.py, got {actual_args}')

          parallelism = spec.get('parallelism')
          task_count = spec.get('taskCount')
          print(f'Parallelism: {parallelism} (expected: 1)')
          print(f'Task Count:  {task_count} (expected: 1)')
          if parallelism != 1 or task_count != 1:
              errors.append(f'Single-task defense-in-depth settings invalid: parallelism={parallelism}, taskCount={task_count}')

          env_list = container.get('env', [])
          env = {e.get('name'): e.get('value', '') for e in env_list}

          if env.get('ENABLE_DISTRIBUTED_LOCK', '').strip().lower() != 'true':
              errors.append(f\"ENABLE_DISTRIBUTED_LOCK must be 'true', found: '{env.get('ENABLE_DISTRIBUTED_LOCK')}'\")

          if env.get('FIRESTORE_ENABLED', '').strip().lower() != 'true':
              errors.append(f\"FIRESTORE_ENABLED must be 'true', found: '{env.get('FIRESTORE_ENABLED')}'\")

          travel_val = env.get('TRAVEL_MODE', '').strip().lower()
          if travel_val not in ('active', 'true', '1', 'yes'):
              errors.append(f\"TRAVEL_MODE must be ACTIVE/true, found: '{env.get('TRAVEL_MODE')}'\")

          if env.get('COMMERCIAL_ACTIONS_ENABLED', '').strip().lower() != 'false':
              errors.append(f\"COMMERCIAL_ACTIONS_ENABLED must be 'false', found: '{env.get('COMMERCIAL_ACTIONS_ENABLED')}'\")

          if env.get('AUTOMATED_EMAIL_ENABLED', '').strip().lower() != 'false':
              errors.append(f\"AUTOMATED_EMAIL_ENABLED must be 'false', found: '{env.get('AUTOMATED_EMAIL_ENABLED')}'\")

          if env.get('TECHNICAL_AUTOMATION_ENABLED', '').strip().lower() != 'true':
              errors.append(f\"TECHNICAL_AUTOMATION_ENABLED must be 'true', found: '{env.get('TECHNICAL_AUTOMATION_ENABLED')}'\")

          if env.get('DRY_RUN', '').strip().lower() != 'true':
              errors.append(f\"DRY_RUN must be 'true', found: '{env.get('DRY_RUN')}'\")

          if errors:
              for err in errors:
                  print(f'::error::[Verification Failure] {err}', file=sys.stderr)
              sys.exit(1)

          print('========================================================================')
          print('DEPLOYMENT VERIFICATION PASSED: All configuration & safety checks match.')
          print('CRITICAL SAFETY INVARIANT: Cloud Run Job was NOT triggered or executed.')
          print('========================================================================')
          " "${EXPECTED_IMAGE}" "${{ env.RUNTIME_SERVICE_ACCOUNT }}"

      - name: "Promote Verified API Revision to Primary Traffic"
        if: ${{ github.event.inputs.promote_traffic != 'false' }}
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          echo "Promoting readiness-verified API revision $CANDIDATE_REVISION to 100% primary traffic..."
          gcloud run services update-traffic "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="$CANDIDATE_REVISION=100" \
            --quiet

      - name: "Verify Primary Traffic & Health (Rollback on Failure)"
        if: ${{ github.event.inputs.promote_traffic != 'false' }}
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          PREVIOUS_PRIMARY_REVISION: ${{ steps.capture_primary.outputs.revision }}
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"
          EXPECTED_IMAGE="$IMAGE_BASE:$DEPLOY_TAG"

          rollback() {
            echo "::error::Primary revision verification failed; attempting rollback to $PREVIOUS_PRIMARY_REVISION."
            if ! gcloud run services update-traffic "$API_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --to-revisions="$PREVIOUS_PRIMARY_REVISION=100" \
              --quiet; then
              echo "::error::Automatic traffic rollback failed. Manual traffic recovery is required."
            fi
          }

          if ! gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/api-service-routed.json"; then
            rollback
            exit 1
          fi

          if ! python3 scripts/verify_cloud_run_api_service.py routed \
            "$RUNNER_TEMP/api-service-routed.json" \
            "$API_RUNTIME_SERVICE_ACCOUNT" \
            "$API_URL" \
            "$EXPECTED_IMAGE" \
            "$CANDIDATE_REVISION"; then
            rollback
            exit 1
          fi

          echo "Checking primary API health after traffic promotion..."
          if ! curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            "$API_URL/api/system/health" -o /dev/null; then
            rollback
            exit 1
          fi
          echo "Primary traffic points to the verified candidate and health is operational."

          echo "Running post-promotion authenticated readiness check on primary URL..."
          if ! python3 scripts/verify_cloud_run_api_candidate.py "$API_URL"; then
            echo "::error::Primary authenticated readiness verification failed."
            rollback
            exit 1
          fi

          echo "Verifying root dashboard HTML rendering on primary URL..."
          DASHBOARD_HTML=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 30 "$API_URL/")
          if ! echo "$DASHBOARD_HTML" | grep -q "Lead Operating System"; then
            echo "::error::Dashboard UI root page failed to return Lead Operating System title."
            rollback
            exit 1
          fi
          echo "Dashboard UI root HTML verified on primary URL."

          echo "=== FINAL TRAFFIC ALLOCATION ==="
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="table(status.traffic.revisionName, status.traffic.percent, status.traffic.tag)"

          echo "=== COMMERCIAL SAFETY LOCKS STATUS ==="
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="json(spec.template.spec.containers[0].env)" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          env_dict = {e.get("name"): e.get("value") for e in data if isinstance(e, dict)}
          for k in ["TRAVEL_MODE", "COMMERCIAL_ACTIONS_ENABLED", "AUTOMATED_EMAIL_ENABLED", "TECHNICAL_AUTOMATION_ENABLED"]:
              print(f"  {k} = {env_dict.get(k, \"NOT SET\")}")
          '

          echo "========================================================================"
          echo "PROMOTION COMPLETE: dripp-leads-api is serving 100% production traffic on $CANDIDATE_REVISION."
          echo "NO DISCOVERY JOB WAS TRIGGERED OR DEPLOYED."
          echo "ALL COMMERCIAL ACTIONS REMAIN DISABLED."
          echo "========================================================================"

