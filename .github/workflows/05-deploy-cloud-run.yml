name: "05 - Production Cloud Run Deployment"

'on':
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Safety Gate: Type 'CONFIRM_DEPLOY_TO_PRODUCTION' to authorize live deployment"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  id-token: write  # Mandatory for Google Workload Identity Federation OIDC token exchange

concurrency:
  group: deploy-production-cloud-run
  cancel-in-progress: false

jobs:
  deploy-cloud-run-job:
    name: "Build & Deploy dripp-discovery-job"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production

    env:
      GCP_PROJECT_ID: "poised-eye-509816-a4"
      GCP_REGION: "us-central1"
      JOB_NAME: "dripp-discovery-job"
      RUNTIME_SERVICE_ACCOUNT: "dripp-international-leads@poised-eye-509816-a4.iam.gserviceaccount.com"
      REGISTRY_HOST: "us-central1-docker.pkg.dev"
      REPOSITORY_NAME: "dripp-media"
      PACKAGE_NAME: "dripp-discovery-job"

    steps:
      - name: "Validate Safety Confirmation Gate"
        env:
          CONFIRM_TOKEN: ${{ github.event.inputs.confirm_deployment }}
        run: |
          if [ "${CONFIRM_TOKEN}" != "CONFIRM_DEPLOY_TO_PRODUCTION" ]; then
            echo "::error::Deployment rejected. confirm_deployment must equal 'CONFIRM_DEPLOY_TO_PRODUCTION'."
            exit 1
          fi
          echo "Deployment safety gate confirmed by operator."

      - name: "Checkout Merged Codebase"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: "Derive Immutable Build Tags"
        id: tags
        run: |
          FULL_SHA="${{ github.sha }}"
          IMAGE_BASE="${{ env.REGISTRY_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.PACKAGE_NAME }}"
          
          # Immutable deployment strictly uses the full Git commit SHA
          DEPLOY_TAG="${FULL_SHA}"
          
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          
          echo "Target Image Base: ${IMAGE_BASE}"
          echo "Deploy Image Tag (Immutable Full SHA): ${DEPLOY_TAG}"

      - name: "Authenticate to Google Cloud via Workload Identity Federation"
        id: auth
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Set up Google Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2.1.4
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: "Configure Docker Artifact Registry Credentials"
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: "Verify Artifact Registry Repository Exists"
        run: |
          if ! gcloud artifacts repositories describe ${{ env.REPOSITORY_NAME }} --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "::error::Artifact Registry repository '${{ env.REPOSITORY_NAME }}' does not exist in ${{ env.GCP_REGION }} for project ${{ env.GCP_PROJECT_ID }}."
            echo "::error::Pre-provisioning by GCP administrator is required before deployment."
            exit 1
          fi
          echo "Artifact Registry repository '${{ env.REPOSITORY_NAME }}' verified."

      - name: "Preflight Existing Cloud Run Job Runtime Identity"
        env:
          EXPECTED_RUNTIME_SA: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          JOB_JSON="$(gcloud run jobs describe "${{ env.JOB_NAME }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format=json)"
          printf '%s' "$JOB_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          actual = (
              data.get('spec', {}).get('template', {}).get('spec', {})
                  .get('template', {}).get('spec', {}).get('serviceAccountName')
              or data.get('template', {}).get('template', {}).get('serviceAccount')
              or data.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
              or ''
          )
          expected = sys.argv[1]
          print(f'Expected runtime identity: {expected}')
          print(f'Actual runtime identity:   {actual or "MISSING"}')
          if actual != expected:
              print('::error::Existing Cloud Run Job runtime service account is missing or unexpected.')
              sys.exit(1)
          print('Runtime service account preflight passed.')
          " "$EXPECTED_RUNTIME_SA"

      - name: "Build Container Image"
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"

          echo "Building container from Dockerfile with immutable full SHA tag..."
          docker build \
            --label "org.opencontainers.image.revision=${{ steps.tags.outputs.full_sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "${IMAGE_BASE}:${DEPLOY_TAG}" \
            .

      - name: "Push Image to Artifact Registry"
        run: |
          IMAGE_BASE="${{ steps.tags.outputs.image_base }}"
          DEPLOY_TAG="${{ steps.tags.outputs.deploy_tag }}"

          echo "Pushing immutable full SHA tag ${DEPLOY_TAG}..."
          docker push "${IMAGE_BASE}:${DEPLOY_TAG}"

      - name: "Deploy & Update Cloud Run Job"
        run: |
          DEPLOY_IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.deploy_tag }}"
          echo "Updating Cloud Run Job '${{ env.JOB_NAME }}' with immutable image ${DEPLOY_IMAGE}..."

          # Update image and safety invariants; preserves unrelated existing environment variables and settings.
          gcloud run jobs update ${{ env.JOB_NAME }} \
            --image="${DEPLOY_IMAGE}" \
            --command=python3 \
            --args=scripts/run_cloud_run_job.py \
            --service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --update-env-vars="ENABLE_DISTRIBUTED_LOCK=true,FIRESTORE_ENABLED=true,TRAVEL_MODE=ACTIVE,DRY_RUN=true,COMMERCIAL_ACTIONS_ENABLED=false,AUTOMATED_EMAIL_ENABLED=false,TECHNICAL_AUTOMATION_ENABLED=true,TZ=UTC" \
            --parallelism=1 \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=30m

      - name: "Read-Back Inspection & Deployment Verification"
        run: |
          echo "Performing read-back inspection of deployed Cloud Run Job..."
          JOB_JSON=$(gcloud run jobs describe ${{ env.JOB_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format=json)

          EXPECTED_IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.deploy_tag }}"
          
          echo "$JOB_JSON" | python3 -c "
          import sys, json

          expected_image = sys.argv[1]
          expected_runtime_sa = sys.argv[2]

          try:
              data = json.load(sys.stdin)
          except Exception as e:
              print(f'::error::Failed to parse Cloud Run Job JSON: {e}', file=sys.stderr)
              sys.exit(1)

          spec = data.get('spec', {}).get('template', {}).get('spec', {})
          containers = spec.get('template', {}).get('spec', {}).get('containers', [])
          if not containers:
              containers = spec.get('containers', [])

          if not containers:
              print('::error::No containers found in deployed Cloud Run Job spec.', file=sys.stderr)
              sys.exit(1)

          container = containers[0]
          actual_image = container.get('image', '')
          actual_command = container.get('command', []) or []
          actual_args = container.get('args', []) or []
          actual_runtime_sa = (
              data.get('spec', {}).get('template', {}).get('spec', {})
                  .get('template', {}).get('spec', {}).get('serviceAccountName')
              or data.get('template', {}).get('template', {}).get('serviceAccount')
              or data.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
              or ''
          )

          errors = []

          print(f'Expected Image: {expected_image}')
          print(f'Actual Image:   {actual_image}')
          if actual_image != expected_image:
              errors.append(f'Deployed image mismatch: expected {expected_image}, got {actual_image}')

          print(f'Expected Runtime Service Account: {expected_runtime_sa}')
          print(f'Actual Runtime Service Account:   {actual_runtime_sa or "MISSING"}')
          if actual_runtime_sa != expected_runtime_sa:
              errors.append(f'Runtime service account mismatch: expected {expected_runtime_sa}, got {actual_runtime_sa or "MISSING"}')

          print(f'Container Command: {actual_command}')
          print(f'Container Args:    {actual_args}')
          if actual_command != ['python3']:
              errors.append(f'Container command must be ["python3"], got {actual_command}')
          if actual_args != ['scripts/run_cloud_run_job.py']:
              errors.append(f'Container args must invoke scripts/run_cloud_run_job.py, got {actual_args}')

          parallelism = spec.get('parallelism')
          task_count = spec.get('taskCount')
          print(f'Parallelism: {parallelism} (expected: 1)')
          print(f'Task Count:  {task_count} (expected: 1)')
          if parallelism != 1 or task_count != 1:
              errors.append(f'Single-task defense-in-depth settings invalid: parallelism={parallelism}, taskCount={task_count}')

          env_list = container.get('env', [])
          env = {e.get('name'): e.get('value', '') for e in env_list}

          if env.get('ENABLE_DISTRIBUTED_LOCK', '').strip().lower() != 'true':
              errors.append(f\"ENABLE_DISTRIBUTED_LOCK must be 'true', found: '{env.get('ENABLE_DISTRIBUTED_LOCK')}'\")

          if env.get('FIRESTORE_ENABLED', '').strip().lower() != 'true':
              errors.append(f\"FIRESTORE_ENABLED must be 'true', found: '{env.get('FIRESTORE_ENABLED')}'\")

          travel_val = env.get('TRAVEL_MODE', '').strip().lower()
          if travel_val not in ('active', 'true', '1', 'yes'):
              errors.append(f\"TRAVEL_MODE must be ACTIVE/true, found: '{env.get('TRAVEL_MODE')}'\")

          if env.get('COMMERCIAL_ACTIONS_ENABLED', '').strip().lower() != 'false':
              errors.append(f\"COMMERCIAL_ACTIONS_ENABLED must be 'false', found: '{env.get('COMMERCIAL_ACTIONS_ENABLED')}'\")

          if env.get('AUTOMATED_EMAIL_ENABLED', '').strip().lower() != 'false':
              errors.append(f\"AUTOMATED_EMAIL_ENABLED must be 'false', found: '{env.get('AUTOMATED_EMAIL_ENABLED')}'\")

          if env.get('TECHNICAL_AUTOMATION_ENABLED', '').strip().lower() != 'true':
              errors.append(f\"TECHNICAL_AUTOMATION_ENABLED must be 'true', found: '{env.get('TECHNICAL_AUTOMATION_ENABLED')}'\")

          if env.get('DRY_RUN', '').strip().lower() != 'true':
              errors.append(f\"DRY_RUN must be 'true', found: '{env.get('DRY_RUN')}'\")

          if errors:
              for err in errors:
                  print(f'::error::[Verification Failure] {err}', file=sys.stderr)
              sys.exit(1)

          print('========================================================================')
          print('DEPLOYMENT VERIFICATION PASSED: All configuration & safety checks match.')
          print('CRITICAL SAFETY INVARIANT: Cloud Run Job was NOT triggered or executed.')
          print('========================================================================')
          " "${EXPECTED_IMAGE}" "${{ env.RUNTIME_SERVICE_ACCOUNT }}"
