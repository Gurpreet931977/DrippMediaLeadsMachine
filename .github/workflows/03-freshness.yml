name: "03 - Technical Freshness & Enrichment"

'on':
  workflow_dispatch:
    inputs:
      market:
        description: "Target Market ID"
        required: true
        default: "MANCHESTER_UK"
        type: string
      refresh_type:
        description: "Freshness Audit Scope"
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "REVIEWS"
          - "CONTACTABILITY"
      limit:
        description: "Candidate Processing Limit"
        required: true
        default: "50"
        type: string
      dry_run:
        description: "DRY RUN MODE (Strictly Safe: No CRM mutations)"
        required: true
        default: true
        type: boolean

  # CRON SCHEDULE DISABLED INTENTIONALLY PER PHASE 11.0 SECTION 18.
  # Do not enable unattended cron until manual triggers, regressions, and safety are verified in CI.
  # schedule:
  #   - cron: "0 4 * * *" # Daily 04:00 UTC (disabled)

permissions:
  contents: read

concurrency:
  group: technical-freshness-production
  cancel-in-progress: false

jobs:
  run-freshness-refresh:
    name: "Execute Technical Freshness"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TRAVEL_MODE: "true"
      COMMERCIAL_ACTIONS_ENABLED: "false"
      AUTOMATED_EMAIL_ENABLED: "false"
      TECHNICAL_AUTOMATION_ENABLED: "true"
      TZ: "UTC"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Set up Gosom Scraper"
        run: |
          python scripts/setup_gosom.py

      - name: "Bootstrap Storage Readiness"
        run: |
          python -c "from lib.system.storage_bootstrap import bootstrap_storage_baseline; bootstrap_storage_baseline()"

      - name: "Enforce Production Safety Invariants"
        run: |
          python -c "
          from lib.system.system_config import SystemConfig
          assert SystemConfig.TRAVEL_MODE, 'CRITICAL: TRAVEL_MODE must be ACTIVE'
          assert not SystemConfig.COMMERCIAL_ACTIONS_ENABLED, 'CRITICAL: COMMERCIAL_ACTIONS must be DISABLED'
          assert not SystemConfig.AUTOMATED_EMAIL_ENABLED, 'CRITICAL: AUTOMATED_EMAIL must be DISABLED'
          assert not SystemConfig.can_execute_commercial_actions(), 'CRITICAL: Commercial actions forbidden'
          print('✓ Mandatory safety invariants enforced.')
          "

      - name: "Execute Technical Freshness Refresh"
        run: |
          DRY_RUN_ARG="${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}"
          python scripts/run_freshness_check.py \
            --market "${{ inputs.market }}" \
            --type "${{ inputs.refresh_type }}" \
            --limit "${{ inputs.limit }}" \
            $DRY_RUN_ARG

      - name: "Upload Freshness Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "freshness-reports"
          path: |
            data/latest_freshness_report.json
            data/latest_freshness_summary.md
          retention-days: 14
