name: "06 - Promote Cloud Run API Traffic"

'on':
  workflow_dispatch:
    inputs:
      confirm_promotion:
        description: "Safety Gate: Type 'CONFIRM_PROMOTE_API_TO_PRODUCTION' to authorize 100% traffic promotion"
        required: true
        default: ""
        type: string
      candidate_revision:
        description: "Target candidate revision for 100% production traffic"
        required: true
        default: "dripp-leads-api-00020-c6x"
        type: string
      rollback_revision:
        description: "Rollback target revision if post-promotion checks fail"
        required: true
        default: "dripp-leads-api-00018-2g8"
        type: string

permissions:
  contents: read
  id-token: write  # Mandatory for Google Workload Identity Federation OIDC token exchange

concurrency:
  group: deploy-production-cloud-run
  cancel-in-progress: false

jobs:
  promote-api-traffic:
    name: "Promote dripp-leads-api Traffic & Post-Promotion Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production

    env:
      GCP_PROJECT_ID: "poised-eye-509816-a4"
      GCP_REGION: "us-central1"
      API_SERVICE: "dripp-leads-api"
      API_RUNTIME_SERVICE_ACCOUNT: "dripp-leads-api@poised-eye-509816-a4.iam.gserviceaccount.com"
      API_URL: "https://dripp-leads-api-ukng7vge6q-uc.a.run.app"
      API_CANDIDATE_URL: "https://release-candidate---dripp-leads-api-ukng7vge6q-uc.a.run.app"
      EXPECTED_IMAGE_BASE: "us-central1-docker.pkg.dev/poised-eye-509816-a4/dripp-media/dripp-discovery-job"
      EXPECTED_IMAGE_TAG: "123ee3bbce9b1207a50a7a6c8828cb24014c5ce2"
      EXPECTED_IMAGE_DIGEST: "sha256:991bb03c169edd467eb3c4c8548f6907f5d749d5ca69f6a800541d173812cc89"

    steps:
      - name: "Validate Safety Confirmation Gate"
        env:
          CONFIRM_TOKEN: ${{ github.event.inputs.confirm_promotion }}
        run: |
          if [ "${CONFIRM_TOKEN}" != "CONFIRM_PROMOTE_API_TO_PRODUCTION" ]; then
            echo "::error::Promotion rejected. confirm_promotion must equal 'CONFIRM_PROMOTE_API_TO_PRODUCTION'."
            exit 1
          fi
          echo "Traffic promotion safety gate confirmed by operator."

      - name: "Validate Operator Secret Available"
        env:
          DRIPP_OPERATOR_KEY: ${{ secrets.DRIPP_OPERATOR_KEY }}
        run: |
          if [ -z "${DRIPP_OPERATOR_KEY:-}" ]; then
            echo "::error::DRIPP_OPERATOR_KEY is missing from Production environment secrets."
            exit 1
          fi
          echo "::add-mask::${DRIPP_OPERATOR_KEY}"
          echo "Operator authentication key is available."

      - name: "Checkout Merged Codebase"
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: "Authenticate to Google Cloud via Workload Identity Federation"
        id: auth
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Set up Google Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2.1.4
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: "Pre-Promotion Revalidation & Commercial Locks Guard"
        env:
          CANDIDATE_REV: ${{ github.event.inputs.candidate_revision }}
          ROLLBACK_REV: ${{ github.event.inputs.rollback_revision }}
          EXPECTED_DIGEST: ${{ env.EXPECTED_IMAGE_DIGEST }}
          EXPECTED_TAG: ${{ env.EXPECTED_IMAGE_TAG }}
        run: |
          echo "=== 1. Revalidating Candidate Revision $CANDIDATE_REV ==="
          gcloud run revisions describe "$CANDIDATE_REV" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/candidate-revision.json"

          echo "=== 2. Revalidating Current Service State & Traffic ==="
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/service-pre-promote.json"

          python3 -c '
          import sys, os, json

          candidate_rev = os.environ["CANDIDATE_REV"]
          rollback_rev = os.environ["ROLLBACK_REV"]
          expected_digest = os.environ["EXPECTED_DIGEST"]
          expected_tag = os.environ["EXPECTED_TAG"]
          runner_temp = os.environ["RUNNER_TEMP"]

          with open(os.path.join(runner_temp, "candidate-revision.json")) as f:
              cand_data = json.load(f)

          with open(os.path.join(runner_temp, "service-pre-promote.json")) as f:
              svc_data = json.load(f)

          errors = []

          # Verify candidate image and digest
          cand_spec = cand_data.get("spec", {})
          containers = cand_spec.get("containers", [])
          cand_image = containers[0].get("image", "") if containers else ""
          cand_digest = cand_data.get("status", {}).get("imageDigest", "")

          print(f"Candidate Deployed Image:  {cand_image}")
          print(f"Candidate Deployed Digest: {cand_digest}")

          if expected_tag not in cand_image:
              errors.append(f"Candidate image tag mismatch: expected tag {expected_tag} in {cand_image}")

          if cand_digest and cand_digest != expected_digest:
              errors.append(f"Candidate image digest mismatch: expected {expected_digest}, got {cand_digest}")

          # Verify candidate readiness condition
          conditions = cand_data.get("status", {}).get("conditions", [])
          ready_cond = next((c for c in conditions if c.get("type") == "Ready"), None)
          ready_status = ready_cond.get("status") if ready_cond else None
          print(f"Candidate Revision Ready:  {ready_status}")
          if ready_status != "True":
              errors.append(f"Candidate revision is not Ready: {ready_cond}")

          # Verify current traffic allocation (must have rollback_rev at 100%)
          traffic = svc_data.get("status", {}).get("traffic", [])
          weighted = [t for t in traffic if t.get("percent", 0) > 0]
          print("Current Weighted Traffic Allocations:")
          for t in weighted:
              print(f"  {t.get(\"revisionName\")}: {t.get(\"percent\")}% (tag: {t.get(\"tag\", \"none\")})")

          if len(weighted) != 1 or weighted[0].get("revisionName") != rollback_rev or weighted[0].get("percent") != 100:
              errors.append(f"Pre-promotion traffic mismatch: expected 100% on {rollback_rev}, got {weighted}")

          # Verify commercial safety locks
          svc_containers = svc_data.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          env_vars = {e.get("name"): e.get("value", "") for e in svc_containers[0].get("env", [])} if svc_containers else {}

          comm = env_vars.get("COMMERCIAL_ACTIONS_ENABLED", "").lower()
          email = env_vars.get("AUTOMATED_EMAIL_ENABLED", "").lower()
          travel = env_vars.get("TRAVEL_MODE", "").lower()

          print(f"Commercial Locks: COMMERCIAL_ACTIONS_ENABLED={comm}, AUTOMATED_EMAIL_ENABLED={email}, TRAVEL_MODE={travel}")
          if comm != "false":
              errors.append(f"COMMERCIAL_ACTIONS_ENABLED must be false, got {comm}")
          if email != "false":
              errors.append(f"AUTOMATED_EMAIL_ENABLED must be false, got {email}")
          if travel not in ("active", "true", "1", "yes"):
              errors.append(f"TRAVEL_MODE must be ACTIVE, got {travel}")

          if errors:
              for err in errors:
                  print(f"::error::[Pre-Promotion Check Failure] {err}", file=sys.stderr)
              sys.exit(1)

          print("PRE-PROMOTION CHECKS PASSED: Candidate identity, digests, traffic, and commercial locks verified.")
          '

          echo "=== 3. Candidate Endpoint Health Probe ==="
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            "$API_CANDIDATE_URL/api/system/health" -o /dev/null
          echo "Candidate endpoint health probe passed (HTTP 200)."

      - name: "Promote Candidate Revision to 100% Production Traffic"
        env:
          CANDIDATE_REV: ${{ github.event.inputs.candidate_revision }}
        run: |
          echo "========================================================================"
          echo "PROMOTING $CANDIDATE_REV TO 100% PRODUCTION TRAFFIC FOR $API_SERVICE"
          echo "Strict Boundary: dripp-discovery-job is NOT touched or deployed."
          echo "========================================================================"
          gcloud run services update-traffic "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="$CANDIDATE_REV=100" \
            --quiet
          echo "Traffic switch command completed."

      - name: "Post-Promotion Health, Authentication & Readiness Checks (Auto-Rollback on Failure)"
        env:
          CANDIDATE_REV: ${{ github.event.inputs.candidate_revision }}
          ROLLBACK_REV: ${{ github.event.inputs.rollback_revision }}
          DRIPP_OPERATOR_KEY: ${{ secrets.DRIPP_OPERATOR_KEY }}
          EXPECTED_IMAGE: "${{ env.EXPECTED_IMAGE_BASE }}:${{ env.EXPECTED_IMAGE_TAG }}"
        run: |
          rollback() {
            echo "::error::CRITICAL POST-PROMOTION CHECK FAILED! Initiating immediate rollback to $ROLLBACK_REV..."
            if ! gcloud run services update-traffic "$API_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --to-revisions="$ROLLBACK_REV=100" \
              --quiet; then
              echo "::error::EMERGENCY: Automatic traffic rollback command failed! Manual intervention required."
              exit 1
            fi
            echo "Rollback command executed. Verifying rolled back primary health..."
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 30 \
              "$API_URL/api/system/health" || true
            echo "Traffic successfully reverted to $ROLLBACK_REV."
          }

          echo "=== 1. Read-Back Inspection of Routed Service ==="
          if ! gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/service-post-promote.json"; then
            rollback
            exit 1
          fi

          echo "=== 2. Verifying Cloud Run API Service Routing & Invariants ==="
          if ! python3 scripts/verify_cloud_run_api_service.py routed \
            "$RUNNER_TEMP/service-post-promote.json" \
            "$API_RUNTIME_SERVICE_ACCOUNT" \
            "$API_URL" \
            "$EXPECTED_IMAGE" \
            "$CANDIDATE_REV"; then
            echo "::error::Service routing verification failed."
            rollback
            exit 1
          fi

          echo "=== 3. Primary URL Health Probe ==="
          if ! curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            "$API_URL/api/system/health" -o /dev/null; then
            echo "::error::Primary health probe failed after traffic switch."
            rollback
            exit 1
          fi
          echo "Primary URL health probe: HTTP 200 OPERATIONAL."

          echo "=== 4. Authenticated Operator Login, CRM Connectivity & Readiness Gates ==="
          if ! python3 scripts/verify_cloud_run_api_candidate.py "$API_URL"; then
            echo "::error::Primary authenticated readiness verification failed."
            rollback
            exit 1
          fi

          echo "=== 5. Root Dashboard UI & Static Assets Health Probe ==="
          DASHBOARD_HTML=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 30 "$API_URL/")
          if ! echo "$DASHBOARD_HTML" | grep -q "Lead Operating System"; then
            echo "::error::Dashboard UI root page failed to return Lead Operating System title."
            rollback
            exit 1
          fi
          echo "Dashboard UI root HTML verified."

          echo "========================================================================"
          echo "POST-PROMOTION VERIFICATION COMPLETED SUCCESSFULLY"
          echo "All critical health, auth, CRM, readiness, and UI checks passed."
          echo "========================================================================"

      - name: "Record Final Production Traffic Allocation & Evidence"
        env:
          CANDIDATE_REV: ${{ github.event.inputs.candidate_revision }}
        run: |
          echo "=== FINAL PRODUCTION TRAFFIC ALLOCATION ==="
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="table(status.traffic.revisionName, status.traffic.percent, status.traffic.tag)"

          echo "=== COMMERCIAL SAFETY LOCKS STATUS ==="
          gcloud run services describe "$API_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format="json(spec.template.spec.containers[0].env)" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          env_dict = {e.get("name"): e.get("value") for e in data if isinstance(e, dict)}
          for k in ["TRAVEL_MODE", "COMMERCIAL_ACTIONS_ENABLED", "AUTOMATED_EMAIL_ENABLED", "TECHNICAL_AUTOMATION_ENABLED"]:
              print(f"  {k} = {env_dict.get(k, \"NOT SET\")}")
          '

          echo "PROMOTION COMPLETE: dripp-leads-api is serving 100% production traffic on $CANDIDATE_REV."
          echo "NO DISCOVERY JOB WAS TRIGGERED OR DEPLOYED."
          echo "ALL COMMERCIAL ACTIONS REMAIN DISABLED."
