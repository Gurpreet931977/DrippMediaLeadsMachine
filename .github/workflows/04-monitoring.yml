name: "04 - Technical Monitoring & Health Audit"

'on':
  workflow_dispatch:

  # CRON SCHEDULE DISABLED INTENTIONALLY PER PHASE 11.0 SECTION 18.
  # schedule:
  #   - cron: "0 */6 * * *" # Every 6 hours (disabled)

permissions:
  contents: read

concurrency:
  group: technical-monitoring-production
  cancel-in-progress: false

jobs:
  run-system-monitoring:
    name: "System Health & Integrity Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TRAVEL_MODE: "true"
      COMMERCIAL_ACTIONS_ENABLED: "false"
      AUTOMATED_EMAIL_ENABLED: "false"
      TECHNICAL_AUTOMATION_ENABLED: "true"
      TZ: "UTC"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Bootstrap Storage Readiness"
        run: |
          python -c "from lib.system.storage_bootstrap import bootstrap_storage_baseline; bootstrap_storage_baseline()"

      - name: "Run Security Credential Scan"
        run: |
          python scripts/security_secret_scan.py

      - name: "Run Production Startup Pre-flight"
        run: |
          python scripts/start_production.py --check-only

      - name: "Run Comprehensive Health & Invariant Audit"
        run: |
          python scripts/system_health_check.py

      - name: "Upload Monitoring Audit Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "monitoring-health-reports"
          path: |
            data/latest_health_report.json
            data/latest_health_summary.md
            data/monitoring_report.json
          retention-days: 14
